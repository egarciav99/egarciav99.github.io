name: Generar CV en PDF

# Regenera los CV en PDF (Elier_Garcia_CV_*.pdf) desde cv.html cada vez que
# cambia algo de lo que sale en el CV (incluida la sincronización desde eg-content).
on:
  push:
    branches: [main]
    paths:
      - index.html
      - cv.html
      - scripts/i18n.js
      - scripts/projects-i18n.js
      - scripts/cv.js
      - scripts/build-cv.mjs
      - styles/cv.css
      - assets/profile.*
      - .github/workflows/cv.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cv-pdf
  cancel-in-progress: false

jobs:
  cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Generar y subir los PDF
        # Si main cambia mientras se generan (p. ej. otra sincronización), se vuelve a partir
        # del último main y se regeneran, en vez de rebasar PDF binarios.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/build-cv.mjs
            git add Elier_Garcia_CV_*.pdf
            if git diff --cached --quiet; then
              echo "Sin cambios en los PDF."
              exit 0
            fi
            git commit -m "CV en PDF regenerado desde la web ($(git rev-parse --short HEAD))"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main cambió mientras se generaban los PDF; reintento $intento."
          done
          exit 1
